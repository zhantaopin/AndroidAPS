name: iOS unsigned IPA

# 在 GitHub 的 macOS runner 上产出未签名 IPA：不需要 Apple Developer 账号、证书或描述文件。
# 产物下载后用 AltStore / Sideloadly / TrollStore 在手机上重签安装。
#
# 流程和官方 ios-testflight.yml 相同，只把签名与上传换成「关掉签名 + 手动打 Payload 包」：
#   - CODE_SIGNING_ALLOWED=NO 让 Xcode 完全跳过 CodeSign 阶段
#   - 不走 xcodebuild -exportArchive，因为它即使禁用签名也要求非空的 team id 和 profile
#   - IPA 就是 Payload/<App>.app 的 zip，直接用 ditto 打
#
# Kotlin 链接被单独提成一个 step：它在 Xcode 构建脚本里跑时没有任何输出，卡住时无法
# 分辨「在链接」还是「内存交换」。单独跑之后，每个 `> Task` 都会实时出现在日志里。

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - 'shared/**'
      - 'core/**'
      - 'database/**'
      - 'plugins/**'
      - 'implementation/**'
      - 'ui/**'
      - 'buildSrc/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/ios-unsigned-ipa.yml'

permissions:
  contents: read

concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  # release 链接的峰值内存超过 runner 的默认堆上限，先撞上的是 swap 而不是 CPU。
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx3g"

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 100

    strategy:
      fail-fast: false
      matrix:
        # AAPSClient2 先不跑：两个 scheme 各自完整编译一遍 Kotlin/Native，
        # 翻倍耗时且互不共享产物。需要时在这里加回来。
        scheme: [AAPSClient]

    steps:
      - uses: actions/checkout@v5
        with:
          # About 里的 build stamp 来自 git describe，浅克隆没有 tag 可用。
          fetch-depth: 0

      - name: Load jdk version
        run: |
          JAVA_VERSION=$(jq -r '.default' .github/jdk-map.json)
          echo "JAVA_VERSION=$JAVA_VERSION" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      # Xcode 的构建脚本用 /usr/libexec/java_home -v 21 找 JDK；setup-java 装的 JDK
      # 不一定登记到那里，缺了就补一个链接。
      - name: Make JDK visible to java_home
        run: |
          if ! /usr/libexec/java_home -v 21 >/dev/null 2>&1; then
            sudo ln -sfn "$JAVA_HOME" "/Library/Java/JavaVirtualMachines/$(basename "$JAVA_HOME")"
          fi
          /usr/libexec/java_home -v 21

      # Kotlin/Native 的编译器与预编译库约 1GB，缓存掉首次下载。
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # 写入 AAPS_MARKETING_VERSION / AAPS_BUILD_NUMBER，供 Info.plist 使用。
      - name: Generate the version numbers
        run: ./gradlew --console=plain --no-daemon :ios:shell:generateIosVersionXcconfig

      # Signing.xcconfig 里有 `#include? "Signing.local.xcconfig"`，这里把它写成空团队，
      # 再把签名相关设置整体关掉。
      - name: Disable signing
        run: |
          cat > ios/app/Signing.local.xcconfig <<EOF
          DEVELOPMENT_TEAM =
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY =
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGNING_ALLOWED = NO
          EOF
          cat ios/app/Signing.local.xcconfig

      # 这一步原本藏在 Xcode 的 Run Script 构建阶段里，现在单独跑，进度可见。
      # 之后 archive 时该任务已经是 up-to-date，Xcode 阶段只剩几十秒。
      - name: Link Kotlin framework (Release, device)
        run: |
          set -o pipefail
          ./gradlew --console=plain --no-daemon --stacktrace \
            :ios:shell:linkReleaseFrameworkIosArm64 | tee link.log

      - name: Archive (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/app/AAPSClient.xcodeproj \
            -scheme ${{ matrix.scheme }} \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/${{ matrix.scheme }}.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            ONLY_ACTIVE_ARCH=NO \
            archive | tee archive.log

      - name: Package unsigned IPA
        run: |
          set -o pipefail
          APP_DIR=$(find "$RUNNER_TEMP/${{ matrix.scheme }}.xcarchive/Products" -name '*.app' -type d -print -quit)
          if [ -z "$APP_DIR" ]; then
            echo "::error::No .app found inside the xcarchive"
            exit 1
          fi
          echo "Found app: $APP_DIR"

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_DIR" "$RUNNER_TEMP/Payload/"

          IPA="$RUNNER_TEMP/${{ matrix.scheme }}.ipa"
          # ditto 比 zip -r 更能保留符号链接和扩展属性
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$IPA"
          rm -rf "$RUNNER_TEMP/Payload"
          echo "IPA: $IPA ($(du -h "$IPA" | cut -f1))"

      # 侧载工具期待二进制里没有内嵌签名；这里只做提示，不阻断。
      - name: Report signature state
        run: |
          APP_DIR=$(find "$RUNNER_TEMP/${{ matrix.scheme }}.xcarchive/Products" -name '*.app' -type d -print -quit)
          if codesign -dv "$APP_DIR" >/dev/null 2>&1; then
            echo "::warning::The app still carries a signature; sideloaders will strip it anyway."
          else
            echo "The app is unsigned, as expected."
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scheme }}-unsigned-ipa
          path: ${{ runner.temp }}/${{ matrix.scheme }}.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scheme }}-build-log
          path: |
            link.log
            archive.log
          retention-days: 7
